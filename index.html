<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Tracker</title>
    <link rel="shortcut icon" href="/assets/favicon.png" type="image/x-icon">
    <link rel="stylesheet" href="style.css">
    <!-- font  -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
        rel="stylesheet">

    <!-- tailwind and daisyui  -->
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
 
     <!-- fontawsome cdn  -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg==" crossorigin="anonymous" referrerpolicy="no-referrer">


</head>

<body class="inter-font">
    <section class="flex justify-center items-center w-screen h-screen bg-slate-100">
        <div class="min-w-4/12 p-10 min-h-6/12 border rounded-lg bg-slate-200">
            
               <form id="task-add-from" action="">
                 <div class="join w-full">
                    <div class="flex-1">
                        <label class="input validator w-full join-item">
                            <input type="text" id="input-bar" class="" placeholder="Start writing and press enter to create task" required />
                        </label>
                 </div>
                    <button type="submit" class="btn btn-neutral join-item"><i class="fa-solid fa-person-arrow-down-to-line"></i></button>
                </div>
               </form>
                <div>
                    <ul id="list_container" class="p-2 text-lg ">

                    </ul>
                </div>
         
        </div>
    </section>

    <script src="script.js "></script>
</body>

</html>
